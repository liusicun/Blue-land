<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="{{ page.layout }}{% if page.body_class %} {{ page.body_class }}{% endif %}{% if page.layout == 'post' or page.layout == 'page' %} reading{% endif %}">
  <div class="frame">
    {% include header.html %}
    <main>
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <div class="veil" aria-hidden="true"><i></i></div>
  <script>
    (function () {
      var root = document.documentElement, btn = document.querySelector('.theme-toggle');
      if (btn) btn.addEventListener('click', function () {
        var cur = root.getAttribute('data-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var next = cur === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('bl-theme', next); } catch (e) {}
        if (window.blTint) blTint(next);
      });

      // 换页动画：点站内链接时内容淡出、蓝点放大，新页面里再收回
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (root.classList.contains('arrive')) setTimeout(function () { root.classList.remove('arrive'); }, 460);
      document.addEventListener('click', function (e) {
        if (e.defaultPrevented || reduce || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var a = e.target.closest && e.target.closest('a[href]');
        if (!a || a.target || a.hasAttribute('download')) return;
        var u = new URL(a.href, location.href);
        if (u.origin !== location.origin) return;
        if (u.pathname === location.pathname && u.search === location.search) return;
        e.preventDefault();
        try { sessionStorage.setItem('bl-go', '1'); } catch (err) {}
        root.classList.add('leave');
        setTimeout(function () { location.href = a.href; }, 260);
      });
      window.addEventListener('pageshow', function (e) { if (e.persisted) root.classList.remove('leave', 'arrive'); });

      // 文章页顶部的阅读进度：一颗石头沿缓坡往上推，坡跟着它画出来，读完正好到顶
      var bar = document.querySelector('.progress');
      if (bar) {
        var slope = bar.querySelector('path'), stone = bar.querySelector('circle');
        var R = 4, L = 0, tick = false;
        var lay = function () {   // 坡的形状和主页那道一样：左下起步，右上到顶；宽度跟着屏幕走
          var w = bar.clientWidth, h = bar.clientHeight;
          var x0 = R + 6, x1 = w - R - 6, yb = h - 10, yt = 2 * R + 2, dx = x1 - x0, dy = yb - yt;
          slope.setAttribute('d', 'M' + x0 + ' ' + yb + ' C ' + (x0 + dx * .34).toFixed(1) + ' ' + yb + ' ' +
            (x0 + dx * .61).toFixed(1) + ' ' + (yt + dy * .12).toFixed(1) + ' ' + x1 + ' ' + yt);
          L = slope.getTotalLength();
          slope.style.strokeDasharray = L;
        };
        var draw = function () {
          tick = false;
          var max = document.documentElement.scrollHeight - innerHeight;
          var p = max > 0 ? Math.max(0, Math.min(1, scrollY / max)) : 0;
          var pt = slope.getPointAtLength(L * p);
          slope.style.strokeDashoffset = (L * (1 - p)).toFixed(2);
          stone.setAttribute('cx', pt.x.toFixed(2)); stone.setAttribute('cy', (pt.y - R).toFixed(2));
          bar.classList.toggle('on', max > 40 && scrollY > 6);   // 还没开始读、或一屏就读完的短文：不显示
          bar.classList.toggle('top', p > .995);       // 到顶了
        };
        addEventListener('scroll', function () { if (!tick) { tick = true; requestAnimationFrame(draw); } }, { passive: true });
        addEventListener('resize', function () { lay(); draw(); });
        lay(); draw();
      }
    })();
  </script>
</body>
</html>
