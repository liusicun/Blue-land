# ===== Blue Land 站点设置 =====
title: Blue Land
description: A quiet blue corner for notes on life, ideas and things I have read.
# 主页大标题下面的那一句话
slogan: "Il faut imaginer Sisyphe heureux."
slogan_lang: fr
lang: en

# 部署地址（部署时再改）：
#   仓库叫 blue-land        → url: "https://<用户名>.github.io"  baseurl: "/blue-land"
#   仓库叫 <用户名>.github.io → url: "https://<用户名>.github.io"  baseurl: ""
url: "https://liusicun.github.io"
baseurl: "/Blue-land"

permalink: /:year/:month/:day/:title/
timezone: Asia/Hong_Kong

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      image: /assets/og/default.png   # 分享卡片；每篇文章另有自己的一张
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
