---
layout: default
title: 文章
permalink: /posts/
---
<header class="center-head">
  <h1 class="spaced">文章<i aria-hidden="true"></i></h1>
  <p class="sub">{{ site.posts | size }} 篇</p>
</header>
<ul class="entries" aria-label="文章列表">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}"{% if post.lang %} lang="{{ post.lang }}"{% endif %}>
      <span class="t">{{ post.title }}</span>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y.%m.%d" }}</time>
    </a>
  </li>
  {% else %}
  <li class="sub">还没有文章。</li>
  {% endfor %}
</ul>
