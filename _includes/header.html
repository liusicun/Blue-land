<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}"{% if page.layout == 'home' %} hidden{% endif %}><span class="blue">Blue</span> Land<i aria-hidden="true"></i></a>
  <nav class="site-nav" aria-label="主导航">
    <a href="{{ '/posts/' | relative_url }}"{% if page.url == '/posts/' or page.layout == 'post' %} aria-current="page"{% endif %}>文章</a>
    <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    <button class="theme-toggle" type="button" aria-label="切换深浅色" title="切换深浅色"></button>
  </nav>
</header>
