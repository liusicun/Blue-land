<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}"{% if page.url == '/' %} hidden{% endif %}><span class="blue">Blue</span> Land<i aria-hidden="true"></i></a>
  <nav class="site-nav" aria-label="Main">
    <a href="{{ '/posts/' | relative_url }}"{% if page.url == '/posts/' or page.layout == 'post' and page.hidden != true %} aria-current="page"{% endif %}>Posts</a>
    <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
  </nav>
</header>
