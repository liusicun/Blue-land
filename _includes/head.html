<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- 不想被搜到：请搜索引擎不要收录、不要顺着链接爬 -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1763" media="(prefers-color-scheme: dark)">
<script>
  // 手动选过白天 / 蓝色模式：手机浏览器顶栏的颜色也跟着换
  function blTint(t) { var c = t === 'dark' ? '#0e1763' : '#fafafb'; [].forEach.call(document.querySelectorAll('meta[name="theme-color"]'), function (m) { m.content = c; }); }
  try { var t = localStorage.getItem('bl-theme'); if (t) { document.documentElement.setAttribute('data-theme', t); blTint(t); } } catch (e) {}
  try { if (sessionStorage.getItem('bl-go')) { sessionStorage.removeItem('bl-go'); document.documentElement.classList.add('arrive'); } } catch (e) {}
  try { if (new Date().getHours() < 5) document.documentElement.classList.add('night'); } catch (e) {}
  // 文章目录页的看法：默认地图集，访客切到列表后记住
  (function () { var v = 'atlas'; try { if (localStorage.getItem('bl-view') === 'list') v = 'list'; } catch (e) {} document.documentElement.classList.add('view-' + v); })();
{%- if page.url == '/' %}
  // 主页开场：每次打开网站只放一遍
  try { if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !sessionStorage.getItem('bl-intro')) document.documentElement.classList.add('stone-intro'); } catch (e) {}
{%- endif %}
</script>
<!-- 标题和小字的字体提前加载，打开时不会先闪一下别的字体 -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="{{ '/assets/fonts/syne-latin-700-normal.woff2' | relative_url }}">
<link rel="preload" as="font" type="font/woff2" crossorigin href="{{ '/assets/fonts/ibm-plex-mono-latin-400-normal.woff2' | relative_url }}">
{% if page.layout == 'post' %}<link rel="preload" as="font" type="font/woff" crossorigin href="{{ '/assets/fonts/source-serif-4-latin-400-normal.woff' | relative_url }}">
{% endif %}<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%231c33c9'/></svg>">
