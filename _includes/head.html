<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- 不想被搜到：请搜索引擎不要收录、不要顺着链接爬 -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<script>
  try { var t = localStorage.getItem('bl-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  try { if (sessionStorage.getItem('bl-go')) { sessionStorage.removeItem('bl-go'); document.documentElement.classList.add('arrive'); } } catch (e) {}
  try { if (new Date().getHours() < 5) document.documentElement.classList.add('night'); } catch (e) {}
{%- if page.url == '/' %}
  // 主页开场：每次打开网站只放一遍
  try { if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !sessionStorage.getItem('bl-intro')) document.documentElement.classList.add('stone-intro'); } catch (e) {}
{%- endif %}
</script>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%231c33c9'/></svg>">
{% seo %}
